spring.application.name=loom-worker

# Explicit opt-in for fixed, controlled demonstration failures.
conductor.demo.failures-enabled=${DEMO_FAILURES_ENABLED:false}

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/loom
spring.datasource.username=loom
spring.datasource.password=loom
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway — loom-api owns migrations
spring.flyway.enabled=false

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Redis (Redisson)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true
