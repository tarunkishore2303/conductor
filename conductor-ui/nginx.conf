server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/api/v1/jobs/[0-9a-fA-F-]+/events$ {
        limit_except GET { deny all; }
        proxy_pass http://loom-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
    }

    # Only these operations may compute/store intelligence; no execution mutation.
    location ~ "^/api/v1/ai/runs/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/(summary|analyze-failure)$" {
        limit_except GET POST { deny all; }
        proxy_pass http://loom-api:8080;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }

    location /api/ {
        # Same-origin browser requests; the internal hostname is server-side only.
        limit_except GET { deny all; }
        proxy_pass http://loom-api:8080;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
