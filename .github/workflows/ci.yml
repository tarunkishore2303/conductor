name: Conductor CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conductor-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Build & Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check patch and merged migration immutability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --check
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BASE_SHA" HEAD
            changes=$(git diff --name-status --diff-filter=DMRT "$BASE_SHA" HEAD -- loom-api/src/main/resources/db/migration/)
            if [ -n "$changes" ]; then
              echo "::error::Merged Flyway migrations must not be changed or removed. Add a new version instead."
              printf '%s\n' "$changes"
              exit 1
            fi
          fi
      - name: Build and run unit tests
        run: ./gradlew build --no-daemon --stacktrace
      - name: Verify builds leave tracked files clean
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7

  integration:
    name: Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check Docker runtime
        run: docker info
      - name: Run container-backed tests and Flyway upgrades
        run: ./gradlew :loom-api:integrationTest :loom-worker:integrationTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7

  python:
    name: Python Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s scripts/tests -q

  containers:
    name: Container Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Validate all Compose profiles
        run: docker compose --profile ai --profile demo config --quiet
      - name: Build distinct application images without starting services
        env:
          # Bake schedules its own DAG; use Compose's bounded build concurrency.
          COMPOSE_BAKE: 'false'
        run: docker compose --parallel 2 --profile ai build loom-api loom-ai loom-worker-1 loom-scheduler loom-monitor conductor-ui

  frontend:
    name: Frontend Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: conductor-ui
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: conductor-ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
