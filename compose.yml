name: conductor

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: docker.io/library/postgres:15
    environment:
      POSTGRES_DB: loom
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: loom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loom"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: docker.io/confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: docker.io/confluentinc/cp-kafka:7.5.3
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Loom Services ────────────────────────────────────────────────────────────

  loom-api:
    build:
      context: .
      dockerfile: loom-api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/loom
      SPRING_DATASOURCE_USERNAME: loom
      SPRING_DATASOURCE_PASSWORD: loom
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CONDUCTOR_AI_BASE_URL: http://loom-ai:8085
      CONDUCTOR_AI_TIMEOUT: ${AI_SERVICE_TIMEOUT:-130s}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 15s
      start_interval: 5s

  ollama:
    profiles: [ai]
    image: docker.io/ollama/ollama:0.35.1
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    # No published model endpoint. Install the model explicitly using compose exec.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  loom-ai:
    profiles: [ai]
    build:
      context: .
      dockerfile: loom-ai/Dockerfile
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_MODEL: ${AI_MODEL:-qwen2.5-coder:7b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-120s}
    # Independent of Postgres, Kafka, scheduler and workers.
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 15s

  loom-scheduler:
    build:
      context: .
      dockerfile: loom-scheduler/Dockerfile
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/loom
      SPRING_R2DBC_USERNAME: loom
      SPRING_R2DBC_PASSWORD: loom
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      loom-api:
        condition: service_healthy

  loom-worker-1:
    build:
      context: .
      dockerfile: loom-worker/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/loom
      SPRING_DATASOURCE_USERNAME: loom
      SPRING_DATASOURCE_PASSWORD: loom
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      DEMO_FAILURES_ENABLED: ${DEMO_FAILURES_ENABLED:-false}
      SERVER_PORT: 8081
    depends_on:
      loom-api:
        condition: service_healthy
      redis:
        condition: service_healthy

  loom-worker-2:
    build:
      context: .
      dockerfile: loom-worker/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/loom
      SPRING_DATASOURCE_USERNAME: loom
      SPRING_DATASOURCE_PASSWORD: loom
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      DEMO_FAILURES_ENABLED: ${DEMO_FAILURES_ENABLED:-false}
      SERVER_PORT: 8082
    depends_on:
      loom-api:
        condition: service_healthy
      redis:
        condition: service_healthy

  loom-monitor:
    build:
      context: .
      dockerfile: loom-monitor/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/loom
      SPRING_DATASOURCE_USERNAME: loom
      SPRING_DATASOURCE_PASSWORD: loom
    depends_on:
      postgres:
        condition: service_healthy
      loom-api:
        condition: service_healthy

  # ── Observability ────────────────────────────────────────────────────────────

  prometheus:
    image: docker.io/prom/prometheus:v2.48.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - loom-api
      - loom-monitor

  grafana:
    image: docker.io/grafana/grafana:10.2.3
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:
  ollama_models:
