spring.application.name=loom-monitor
server.port=8083

# Database (read-only view into the same Postgres DB)
spring.datasource.url=jdbc:postgresql://localhost:5432/loom
spring.datasource.username=loom
spring.datasource.password=loom
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway — loom-api owns migrations
spring.flyway.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.prometheus.enabled=true
