spring.application.name=loom-api
conductor.ai.embedding-model=${AI_EMBEDDING_MODEL:nomic-embed-text:v1.5}
conductor.ai.incident-similarity-threshold=${AI_INCIDENT_MIN_SIMILARITY:0.93}
conductor.ai.incident-auto-index-enabled=${AI_ENABLED:false}
conductor.ai.chat-model=${AI_MODEL:qwen2.5-coder:7b}

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/loom
spring.datasource.username=loom
spring.datasource.password=loom
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.locations=classpath:db/migration

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.maximum-expected-value.http.server.requests=180s
